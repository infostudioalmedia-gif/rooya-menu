:root{--navy:#0F194F;--blue:#1F5194;--mint:#48FFE5;--paper:#F1F8FD;--mint-tint:#DDFFFA;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
body{font-family:'Graphik',sans-serif;color:var(--navy);background:var(--paper);min-height:100vh;overflow-x:hidden;}
button,input,textarea{font-family:'Graphik',sans-serif;color:inherit;}

.o{fill:#fff;stroke:var(--blue);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;}
.b{fill:var(--blue);stroke:var(--blue);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;}
.m{fill:var(--mint);stroke:var(--blue);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;}
.n{fill:none;stroke:var(--blue);stroke-width:3.2;stroke-linejoin:round;stroke-linecap:round;}
.nmint{fill:none;stroke:var(--mint);stroke-width:4;stroke-linecap:round;}
.eye{fill:#fff;stroke:var(--blue);stroke-width:2.6;}
.pup{fill:var(--navy);}



/* ---------- motion ---------- */
.eye,.pup{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.mascot{transform-origin:50% 92%;animation:bob 3.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2.5deg)}50%{transform:translateY(-9px) rotate(2.5deg)}}
@keyframes jelly{0%{transform:scale(.4) rotate(-14deg);opacity:0}45%{transform:scale(1.18) rotate(7deg);opacity:1}65%{transform:scale(.92) rotate(-4deg)}85%{transform:scale(1.04) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes pop{0%{transform:translateY(22px) scale(.6);opacity:0}60%{transform:translateY(-6px) scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes steam{0%{stroke-dashoffset:60;opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{stroke-dashoffset:0;opacity:0;transform:translateY(-14px)}}
@keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

/* ---------- hero (first screen) ---------- */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px 70px;position:relative;}
.logo{height:clamp(46px,9svh,72px);width:auto;animation:rise .7s both;}
.title{margin-top:clamp(18px,4svh,36px);font-weight:900;color:var(--navy);line-height:1.08;font-size:clamp(40px,12.5vw,86px);white-space:nowrap;animation:rise .7s .12s both;}
.title em{font-style:normal;color:var(--blue);}
.welcome{margin-top:clamp(12px,2.4svh,20px);font-weight:300;font-size:clamp(17px,4.6vw,24px);color:var(--blue);animation:rise .7s .24s both;}
.bar{display:block;width:64px;height:8px;border-radius:8px;background:var(--mint);margin:clamp(12px,2.4svh,20px) auto 0;animation:rise .7s .3s both;}
.stage{position:relative;margin-top:clamp(14px,3.4svh,34px);width:min(86vw,420px);height:clamp(130px,26svh,230px);animation:rise .8s .4s both;}
.stage svg{position:absolute;}
.stage .m-coffee{left:50%;top:0;width:min(46vw,230px);height:100%;margin-left:calc(min(46vw,230px)/-2);}
.stage .m-tea{left:0;bottom:6%;width:min(22vw,100px);height:56%;}
.stage .m-juice{right:0;bottom:6%;width:min(22vw,100px);height:56%;}
.stage .steam{left:50%;top:-12%;width:min(30vw,130px);height:34%;margin-left:calc(min(30vw,130px)/-2);overflow:visible;}
.steam path{fill:none;stroke:var(--mint);stroke-width:5;stroke-linecap:round;stroke-dasharray:60;animation:steam 2.8s ease-out infinite;}
.cue{position:absolute;bottom:18px;left:50%;margin-left:-40px;width:80px;text-align:center;font-weight:500;font-size:14px;color:var(--blue);text-decoration:none;}
.cue svg{display:block;margin:4px auto 0;width:22px;height:22px;fill:none;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;animation:cue 1.6s ease-in-out infinite;}

/* ---------- menu ---------- */
main{max-width:600px;margin:0 auto;padding:30px 20px 10px;}
.sec{margin-bottom:46px;}
.sec h2{position:relative;display:flex;align-items:flex-end;gap:12px;font-weight:700;font-size:clamp(26px,7vw,34px);line-height:1;color:var(--blue);padding-bottom:12px;}
.sec h2::after{content:"";position:absolute;right:0;bottom:0;height:2.5px;width:100%;background:var(--navy);transform:scaleX(0);transform-origin:100% 50%;transition:transform .8s cubic-bezier(.2,.8,.2,1);}
.sec.in h2::after{transform:scaleX(1);}
.sec h2 .ico{width:66px;height:58px;flex:none;margin-bottom:-4px;opacity:0;cursor:pointer;}
.sec.in h2 .ico{animation:jelly .9s .05s both;}
.sec h2 .ico svg{width:100%;height:100%;overflow:visible;animation:bob 3.6s 1s ease-in-out infinite;transform-origin:50% 92%;}
.sec h2 .ico:active svg{animation:jelly .7s both;}
.sec h2 .w{display:inline-block;opacity:0;}
.sec.in h2 .w{animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.15s + var(--i)*.12s);}
ul{list-style:none;margin-top:12px;display:grid;gap:0;}
li{opacity:0;}
.sec.in li{animation:rise .5s both;animation-delay:calc(.35s + var(--r)*.06s);}
.item{width:100%;height:60px;display:flex;align-items:center;gap:12px;background:transparent;border:0;border-top:1px solid rgba(31,81,148,.18);padding:0 4px 0 2px;cursor:pointer;text-align:right;font-weight:500;font-size:var(--fs,19px);line-height:1.3;color:var(--navy);transition:background .18s;border-radius:0;}
li:first-child .item{border-top:0;}
.cell{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.nm{display:inline-block;white-space:nowrap;text-align-last:justify;flex:none;}
.cell small{margin-inline-start:auto;font-weight:300;font-size:12.5px;color:var(--blue);border:1px solid var(--blue);border-radius:99px;padding:1px 10px;white-space:nowrap;}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;transition:background .18s,border-color .18s,transform .18s;}
.chk svg{width:18px;height:18px;fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.chk .tick{display:none;}
.item:hover .chk{border-color:var(--navy);}
.item[aria-pressed="true"]{background:linear-gradient(90deg,transparent,var(--mint-tint) 40%);}
.item[aria-pressed="true"] .chk{background:var(--navy);border-color:var(--navy);animation:jelly .5s both;}
.item[aria-pressed="true"] .chk .plus{display:none;}
.item[aria-pressed="true"] .chk .tick{display:block;stroke:var(--mint);}

.opts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 4px 14px;animation:rise .35s both;}
.opts[hidden]{display:none;}
.olab{flex-basis:100%;font-weight:300;font-size:14px;color:var(--blue);}
.chip{flex:1;white-space:nowrap;font-weight:500;font-size:15.5px;padding:9px 6px;border-radius:99px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;transition:background .15s,color .15s,transform .15s;}
.chip:active{transform:scale(.95);}
.chip[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:var(--mint);font-weight:700;}
.opts.need{animation:shake .45s;}
.opts.need .olab{color:var(--navy);font-weight:700;}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(7px)}40%{transform:translateX(-7px)}60%{transform:translateX(5px)}80%{transform:translateX(-4px)}}
.lines .opt{display:inline-block;margin-inline-start:8px;font-weight:500;font-size:13px;color:var(--navy);background:var(--mint);border-radius:99px;padding:1px 10px;}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;font-weight:500;font-size:16px;padding:12px 20px;border-radius:99px;transition:transform .25s,opacity .25s;z-index:50;white-space:nowrap;}
.toast.show{transform:translate(-50%,0);opacity:1;}

/* ---------- footer ---------- */
footer{text-align:center;padding:10px 20px calc(120px + env(safe-area-inset-bottom));}
.pals{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:110px;margin-bottom:6px;}
.pals svg{height:100%;width:auto;}
.pals .p2{height:76%;}
footer .bar{margin-top:6px;}
.thanks{margin-top:14px;font-weight:900;font-size:clamp(30px,8.5vw,42px);color:var(--blue);}
.rights{margin:26px auto 0;max-width:420px;padding-top:16px;border-top:1px solid rgba(31,81,148,.2);font-weight:300;font-size:13.5px;line-height:1.7;color:var(--navy);}

/* ---------- order bar + sheet ---------- */
.orderbar{position:fixed;inset:auto 0 0 0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;transform:translateY(130%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s .35s;}
.orderbar.show{transform:none;visibility:visible;transition-delay:0s;}
.orderbar button{pointer-events:auto;width:100%;max-width:560px;display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;border:0;border-radius:20px;padding:12px 14px 12px 18px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(15,25,79,.35);}
.orderbar .cnt{min-width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:17px;}
.orderbar .go{margin-inline-start:auto;display:flex;align-items:center;gap:8px;color:var(--mint);font-weight:700;}
.orderbar .go svg{width:22px;height:22px;fill:none;stroke:var(--mint);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.veil{position:fixed;inset:0;z-index:30;background:rgba(15,25,79,.55);opacity:0;pointer-events:none;transition:opacity .25s;}
.veil.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;z-index:40;inset:auto 0 0 0;margin:0 auto;max-width:600px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.9,.3,1.05),visibility 0s .38s;}
.sheet.show{transform:none;visibility:visible;transition-delay:0s;}
.grab{width:44px;height:5px;border-radius:5px;background:rgba(31,81,148,.3);margin:0 auto 14px;}
.sheet h3{font-weight:900;font-size:26px;color:var(--navy);margin-bottom:6px;}
.lines{list-style:none;margin:6px 0 14px;display:block;}
.lines li{opacity:1;animation:none!important;display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(31,81,148,.16);font-weight:500;font-size:18px;}
.lines li:first-child{border-top:0;}
.lines .ln{flex:1;}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:36px;height:36px;border-radius:50%;border:2px solid var(--blue);background:#fff;font-weight:700;font-size:20px;line-height:1;cursor:pointer;color:var(--blue);}
.qty b{min-width:26px;text-align:center;font-weight:900;font-size:18px;}
.field{display:block;margin-top:12px;}
.field span{display:block;font-weight:500;font-size:15px;color:var(--blue);margin-bottom:6px;}
.field input,.field textarea{width:100%;font-weight:500;font-size:17px;padding:13px 15px;border:2px solid var(--navy);border-radius:14px;background:#fff;outline:none;resize:none;}
.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(72,255,229,.45);}
.send{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--navy);color:var(--mint);border:0;border-radius:18px;padding:16px;font-weight:900;font-size:19px;cursor:pointer;}
.send svg{width:24px;height:24px;fill:none;stroke:var(--mint);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.clear{display:block;margin:12px auto 0;background:none;border:0;font-weight:500;font-size:15px;color:var(--blue);text-decoration:underline;cursor:pointer;}

/* ---------- tablets & desktop: two columns like the print ---------- */
@media (min-width:860px){
  main{max-width:1040px;display:grid;grid-template-columns:1fr 1fr;column-gap:64px;align-items:start;padding-top:40px;}
  .col{min-width:0;}
}
@media (max-width:370px){
  .cell{flex-direction:column;align-items:flex-start;gap:0;justify-content:center;}
  .cell small{margin-inline-start:0;font-size:11.5px;padding:0 8px;}
  .item{height:64px;}
}
@media (max-height:560px) and (orientation:landscape){
  .hero{min-height:auto;padding-bottom:90px;}
  .stage{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
  .sec h2 .w,.sec h2 .ico,li{opacity:1!important;}
  .sec h2::after{transform:scaleX(1);}
}
</style>

.5"/></svg></span></button></li><li style="--r:4"><button type="button" class="item" aria-pressed="false" data-name="نعناع"><span class="cell"><span class="nm">نعناع</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:5"><button type="button" class="item" aria-pressed="false" data-name="كرفس بقدونس"><span class="cell"><span class="nm">كرفس بقدونس</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:6"><button type="button" class="item" aria-pressed="false" data-name="رمان"><span class="cell"><span class="nm">رمان</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:7"><button type="button" class="item" aria-pressed="false" data-name="قرفة بالفواكه"><span class="cell"><span class="nm">قرفة بالفواكه</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:8"><button type="button" class="item" aria-pressed="false" data-name="مرامية"><span class="cell"><span class="nm">مرامية</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li></ul></section></div><div class="col"><section class="sec"><h2><span class="ico" aria-hidden="true"><svg viewBox="0 0 200 170"><use href="#s-coffee"/></svg></span><span class="t">القهوة</span></h2><ul><li style="--r:0"><button type="button" class="item" aria-pressed="false" data-name="نسكافيه"><span class="cell"><span class="nm">نسكافيه</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:1"><button type="button" class="item" aria-pressed="false" data-name="قهوة تركي روست ماستر" data-opts="سادة|عالريحة|مظبوط|زيادة"><span class="cell"><span class="nm">قهوة تركي روست ماستر</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button><div class="opts" hidden role="radiogroup" aria-label="درجة السكر"><span class="olab">درجة السكر</span><button type="button" class="chip" role="radio" aria-checked="false" data-v="سادة">سادة</button><button type="button" class="chip" role="radio" aria-checked="false" data-v="عالريحة">عالريحة</button><button type="button" class="chip" role="radio" aria-checked="false" data-v="مظبوط">مظبوط</button><button type="button" class="chip" role="radio" aria-checked="false" data-v="زيادة">زيادة</button></div></li><li style="--r:2"><button type="button" class="item" aria-pressed="false" data-name="قهوة بالبندق"><span class="cell"><span class="nm">قهوة بالبندق</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:3"><button type="button" class="item" aria-pressed="false" data-name="إسبريسو لافازا إيطالي (سنجل شوت)"><span class="cell"><span class="nm">إسبريسو لافازا إيطالي</span><small>سنجل شوت</small></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:4"><button type="button" class="item" aria-pressed="false" data-name="إسبريسو لافازا إيطالي (دبل شوت)"><span class="cell"><span class="nm">إسبريسو لافازا إيطالي</span><small>دبل شوت</small></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:5"><button type="button" class="item" aria-pressed="false" data-name="كابتشينو"><span class="cell"><span class="nm">كابتشينو</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:6"><button type="button" class="item" aria-pressed="false" data-name="لاتيه"><span class="cell"><span class="nm">لاتيه</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li></ul></section><section class="sec"><h2><span class="ico" aria-hidden="true"><svg viewBox="0 0 120 130"><use href="#s-juice"/></svg></span><span class="t">العصائر</span></h2><ul><li style="--r:0"><button type="button" class="item" aria-pressed="false" data-name="عصير برتقال"><span class="cell"><span class="nm">عصير برتقال</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li><li style="--r:1"><button type="button" class="item" aria-pressed="false" data-name="عصير مانجو"><span class="cell"><span class="nm">عصير مانجو</span></span><span class="chk" aria-hidden="true"><svg class="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></li></ul></section></div>

<div class="orderbar" id="bar"><button type="button" id="openSheet"><span class="cnt" id="cnt">0</span><span>طلبك</span><span class="go">راجع وأرسل<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span></button></div>
<div class="veil" id="veil"></div>
<div class="toast" id="toast" role="status"></div>
<section class="sheet" id="sheet" aria-label="طلبك" aria-hidden="true">
  <div class="grab"></div>
  <h3>طلبك</h3>
  <ul class="lines" id="lines"></ul>
  <label class="field"><span>اسمك أو مكانك (اختياري)</span><input id="who" type="text" placeholder="مثال: أحمد - قاعة 2" autocomplete="name" maxlength="60"></label>
  <label class="field"><span>ملاحظات (اختياري)</span><textarea id="note" rows="2" placeholder="مثال: من غير سكر" maxlength="140"></textarea></label>
  <button class="send" id="send" type="button"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-5A9 9 0 1 1 8 19.4z"/><path d="M9 8.5c.3 3 2.6 5.6 6 6.5l1.3-1.4-2.2-1.2-.9.7c-.9-.4-1.8-1.3-2.3-2.3l.7-.9-1.2-2.2z"/></svg>أرسل الطلب على واتساب</button>
  <button class="clear" id="clear" type="button">مسح الطلب</button>
</section>

<script>
// ===== الإعدادات =====
const CONFIG = {
  phone: "201098066348",              // رقم الواتساب (صيغة دولية بدون + أو أصفار)
  greeting: "السلام عليكم، عايز أطلب:"
};
// ====================
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

/* ---- تمديد الحروف (كشيدة) ---- */
const FWD = 'بتثجحخسشصضطظعغفقكلمنهيئ', ARA = /[ء-ي]/;
function stretch(el, target) {
  const base = el.dataset.t || (el.dataset.t = el.textContent.trim()), words = base.split(' '), slots = [];
  words.forEach((w, wi) => { for (let i = 0; i < w.length - 1; i++)
    if (FWD.includes(w[i]) && ARA.test(w[i + 1]) && !(w[i] === 'ل' && w[i + 1] === 'ا')) slots.push([wi, i]); });
  const build = k => { const c = {}; for (let j = 0; j < k; j++) { const key = slots[j % slots.length].join(); c[key] = (c[key] || 0) + 1; }
    return words.map((w, wi) => [...w].map((ch, i) => ch + 'ـ'.repeat(c[wi + ',' + i] || 0)).join('')).join(' '); };
  const width = k => { el.textContent = build(k); el.style.width = 'auto'; return el.getBoundingClientRect().width; };
  let k = 0;
  if (slots.length && width(0) < target) { while (k < 120 && width(k) < target) k++; if (Math.abs(width(k - 1) - target) < Math.abs(width(k) - target)) k--; width(k); }
  return el.getBoundingClientRect().width;
}
function layoutText() {
  // العنوان
  const t = $('#title'); t.querySelectorAll('span,em').forEach(s => s.style.display = 'inline-block');
  const full = Math.min(innerWidth * 0.9, 560);
  const parts = $$('#title span, #title em'); parts.forEach(p => { p.style.width = 'auto'; p.textContent = p.dataset.t || p.textContent; });
  const nat = parts.reduce((a, p) => a + p.getBoundingClientRect().width, 0), gap = t.getBoundingClientRect().height * 0.25;
  const room = full - gap, ratio = room / Math.max(nat, 1);
  if (ratio > 1.04) parts.forEach(p => { const w = p.getBoundingClientRect().width; stretch(p, w * ratio); });
  // الأصناف: كلها بنفس العرض (زي المطبوع)
  const names = $$('.nm'); names.forEach(n => { n.style.width = 'auto'; n.textContent = n.dataset.t || n.textContent; n.dataset.t = n.textContent; });
  const W = Math.ceil(Math.max(...names.map(n => n.getBoundingClientRect().width)) * 1.04);
  names.forEach(n => { stretch(n, W); n.style.width = W + 'px'; });
}
document.fonts.ready.then(() => { layoutText(); let r; addEventListener('resize', () => { clearTimeout(r); r = setTimeout(layoutText, 150); }); });

/* ---- ظهور الأقسام بالحركة ---- */
$$('.sec h2 .t').forEach(h => { h.innerHTML = h.textContent.trim().split(' ').map((w, i) => '<span class="w" style="--i:' + i + '">' + w + '</span>').join(' '); });
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .18 }) : null;
$$('.sec').forEach(s => io ? io.observe(s) : s.classList.add('in'));

/* ---- الطلب المتعدد ---- */
const order = new Map();            // الاسم -> {q, opt}
const bar = $('#bar'), cnt = $('#cnt'), sheet = $('#sheet'), veil = $('#veil'), lines = $('#lines'), toast = $('#toast');
try { $('#who').value = new URLSearchParams(location.search).get('t') || localStorage.getItem('rooya-who') || ''; } catch (e) {}
$('#who').addEventListener('input', e => { try { localStorage.setItem('rooya-who', e.target.value); } catch (x) {} });
let tt; const say = m => { toast.textContent = m; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 2400); };
const label = (name, o) => name + (o.opt ? ' (' + o.opt + ')' : '');

function paint() {
  const total = [...order.values()].reduce((a, o) => a + o.q, 0);
  cnt.textContent = total; bar.classList.toggle('show', total > 0);
  $$('.item').forEach(b => {
    const on = order.has(b.dataset.name); b.setAttribute('aria-pressed', on);
    const box = b.parentElement.querySelector('.opts');
    if (box) { box.hidden = !on; const cur = on ? order.get(b.dataset.name).opt : null;
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-checked', c.dataset.v === cur)); }
  });
  lines.innerHTML = '';
  order.forEach((o, name) => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="ln"></span><span class="qty"><button type="button" aria-label="زيادة">+</button><b>' + o.q + '</b><button type="button" aria-label="نقص">−</button></span>';
    const ln = li.querySelector('.ln'); ln.textContent = name;
    if (o.opt) { const s = document.createElement('span'); s.className = 'opt'; s.textContent = o.opt; ln.appendChild(s); }
    const [plus, minus] = li.querySelectorAll('button');
    plus.onclick = () => { o.q = Math.min(o.q + 1, 20); paint(); };
    minus.onclick = () => { o.q > 1 ? o.q-- : order.delete(name); paint(); if (!order.size) closeSheet(); };
    lines.appendChild(li);
  });
}
$$('.item').forEach(b => b.addEventListener('click', () => {
  const n = b.dataset.name; order.has(n) ? order.delete(n) : order.set(n, { q: 1, opt: null }); paint();
}));
$$('.chip').forEach(c => c.addEventListener('click', () => {
  const n = c.closest('li').querySelector('.item').dataset.name, o = order.get(n); if (!o) return; o.opt = c.dataset.v; paint();
}));
// لازم الضيف يختار درجة السكر قبل المراجعة
function missingOpt() {
  for (const b of $$('.item[data-opts]')) { const o = order.get(b.dataset.name);
    if (o && !o.opt) { const box = b.parentElement.querySelector('.opts'); box.classList.remove('need'); void box.offsetWidth; box.classList.add('need');
      closeSheet(); b.scrollIntoView({ block: 'center', behavior: 'smooth' }); say('اختار درجة السكر الأول'); return true; } }
  return false;
}
function openSheet() { if (missingOpt()) return; toast.classList.remove('show'); sheet.classList.add('show'); veil.classList.add('show'); sheet.setAttribute('aria-hidden', 'false'); }
function closeSheet() { sheet.classList.remove('show'); veil.classList.remove('show'); sheet.setAttribute('aria-hidden', 'true'); }
$('#openSheet').onclick = openSheet; veil.onclick = closeSheet;
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#clear').onclick = () => { order.clear(); paint(); closeSheet(); };
$('#send').onclick = () => {
  if (!order.size || missingOpt()) return;
  let text = CONFIG.greeting;
  order.forEach((o, name) => { text += '\n- ' + label(name, o) + ' × ' + o.q; });
  const who = $('#who').value.trim(), note = $('#note').value.trim();
  if (who) text += '\n\nالاسم/المكان: ' + who;
  if (note) text += '\nملاحظات: ' + note;
  location.href = 'https://wa.me/' + CONFIG.phone + '?text=' + encodeURIComponent(text);
};
</script>
